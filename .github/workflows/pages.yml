name: Publier le book

# Build du mdBook (book/) + de la référence rustdoc, puis déploiement sur
# GitHub Pages (déploiement officiel par artifact, pas de branche `pages`).
# Le site combiné place le book à la racine et la doc Rust sous `rust/`.
#
# Prérequis côté GitHub (UI, hors dépôt) :
#   Settings > Pages > Build and deployment > Source: "GitHub Actions"

on:
  push:
    branches: [master]
    paths:
      - 'book/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer mdBook et mdbook-mermaid
        # `mdbook-mermaid` manquait ici, et son absence n'est qu'un
        # avertissement : le book se publiait avec son diagramme laissé sous
        # forme de bloc de code brut. Versions épinglées comme dans
        # release.yml, où le commentaire explique pourquoi elles vont ensemble.
        env:
          MDBOOK_VERSION: '0.4.52'
          MDBOOK_MERMAID_VERSION: '0.16.2'
        run: |
          base=https://github.com/rust-lang/mdBook/releases/download
          curl -sSL "$base/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          base=https://github.com/badboy/mdbook-mermaid/releases/download
          curl -sSL "$base/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version && mdbook-mermaid --version

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Builder le book
        run: mdbook build book

      - name: Builder la doc Rust (rustdoc)
        # Rust pur (features par défaut) : ni pyo3 ni libpython requis.
        run: cargo doc --no-deps --lib

      - name: Assembler le site (book + rust/)
        run: |
          rm -rf _site
          mkdir _site
          cp -a book/book/. _site/
          mkdir _site/rust
          cp -a target/doc/. _site/rust/
          # cargo doc ne génère pas d'index.html à la racine de target/doc :
          # on dépose une redirection pour que /rust/ mène à la crate.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=pyrucast/index.html">\n' \
            > _site/rust/index.html

      - name: Uploader l'artifact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
