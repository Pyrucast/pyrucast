name: Publier une release

# Déclenché par un tag vX.Y.Z (créé par script/set_new_version.sh).
# Publie sur crates.io, construit sdist + wheels (Linux manylinux2014,
# Windows, macOS universal2) et les publie sur PyPI.
#
# Prérequis (UI, hors dépôt) :
#   - crates.io : secret CARGO_REGISTRY_TOKEN (Settings > Secrets and
#     variables > Actions).
#   - PyPI : Trusted Publisher enregistré sur le projet PyPI, pointant sur
#     ce dépôt GitHub, workflow "release.yml", environment "pypi".
#     Aucun token PyPI à gérer (OIDC).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  MATURIN_FEATURES: extension-module,viz,viz-interactive,abi3
  # Étiquette de compatibilité attendue sur la wheel macOS. Aucune valeur n'est
  # imposée au compilateur — forcer MACOSX_DEPLOYMENT_TARGET risquerait de casser
  # la moitié arm64, qui ne peut pas viser sous 11.0. On constate ce qui sort, et
  # tout écart devient une décision à prendre plutôt qu'un glissement à subir.
  MACOS_PLATFORM_TAG: macosx_10_12_universal2

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          file_version="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -1)"
          if [ "$file_version" != "$version" ]; then
            echo "Cargo.toml annonce la version $file_version au tag $tag (attendu $version)" >&2
            exit 1
          fi
          # Une seule source de vérité : pyproject délègue, il ne redéclare pas.
          # Une version statique y gagnerait sur Cargo.toml chez maturin, et
          # partirait seule sur PyPI — sans que rien ici ne la lise.
          if ! grep -qE '^[[:space:]]*dynamic[[:space:]]*=.*"version"' pyproject.toml; then
            echo 'pyproject.toml doit porter dynamic = ["version"] (version lue dans Cargo.toml)' >&2
            exit 1
          fi
          if sed -n '/^\[project\]/,/^\[/p' pyproject.toml | grep -qE '^version[[:space:]]*='; then
            echo 'pyproject.toml redéclare version : une seule déclaration, dans Cargo.toml' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Le tag est le seul point de contrôle : les push sur master ne sont pas
  # vérifiés, assumé pour l'instant. Tout ce qui suit dépend donc de ce job,
  # et il lance exactement ce que `set_new_version.sh` lance en local — les
  # cinq blocs de `check_all`, puis `check_clippy`.
  #
  # Un bloc par étape, et non `check_all.sh` en une fois : l'interface Actions
  # montre alors laquelle rougit sans qu'il faille dérouler tout le journal.
  # Ce sont les mêmes scripts, appelés un à un plutôt que par leur boucle.
  #
  # Un seul job, parce que l'ordre est contraignant : `doc_lint.py` importe
  # `pyrucast`, donc `check_doc` exige que `check_python` ait construit le
  # module. Ces blocs ne peuvent pas partir en parallèle.
  verify:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: verify

      # `requires-python = ">=3.11"` : le venv du job doit le tenir. Le Python
      # par défaut du runner convient aujourd'hui, mais rien ne le garantit —
      # et un échec ici se lirait comme une régression du code.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Dépendances système
        # `viz` lie fontconfig et freetype pour le rendu de texte (plotters,
        # sous-feature ttf). Sans elles, `check_rust` échoue à l'édition de liens.
        #
        # La roue `gmsh` embarque son `libgmsh.so`, qui est lié à la pile
        # OpenGL même quand on ne se sert que de son API : sans `libGLU.so.1`
        # ni `libOpenGL.so.0`, le simple `import gmsh` de `check_gmsh` lève un
        # `OSError` au chargement de la bibliothèque.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev libexpat1-dev \
                                  libglu1-mesa libopengl0

      - name: Installer mdBook et mdbook-mermaid
        # `check_doc` construit le book ; le préprocesseur mermaid doit être sur
        # le PATH au moment du build. Versions épinglées, comme dans pages.yml.
        env:
          # Les deux versions vont ensemble et ne se choisissent pas séparément.
          # `mdbook-mermaid` 0.17 a migré du crate `mdbook` vers
          # `mdbook-preprocessor`, c'est-à-dire vers le protocole de mdBook 0.5 :
          # appelé par un mdbook 0.4 il n'arrive plus à désérialiser ce qu'on lui
          # envoie et meurt sur « Unable to parse the input ». 0.16.2 est la
          # dernière à dépendre de `mdbook ^0.4.36`, et elle est construite
          # contre 0.4.52 — d'où ce couple, qui ne laisse même pas
          # l'avertissement de version.
          MDBOOK_VERSION: '0.4.52'
          MDBOOK_MERMAID_VERSION: '0.16.2'
        run: |
          base=https://github.com/rust-lang/mdBook/releases/download
          curl -sSL "$base/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          base=https://github.com/badboy/mdbook-mermaid/releases/download
          curl -sSL "$base/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin
          mdbook --version && mdbook-mermaid --version

      - name: Monter le venv
        # Les `check_*.sh` sourcent `_common.sh`, qui exige `.venv` à la racine
        # et refuse de tourner sans lui.
        run: |
          python3 -m venv .venv
          . ./.venv/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet maturin pytest ruff gmsh

      - name: Les blocs de check_all sont bien les cinq attendus
        # Les étapes ci-dessous énumèrent les blocs une seconde fois. Cette
        # liste-là se constate au lieu de se supposer : un sixième bloc ajouté
        # à `check_all.sh` sans être ajouté ici rougirait ici, plutôt que de
        # n'être jamais lancé au moment de publier.
        run: |
          attendu='format rust python examples doc'
          obtenu="$(sed -nE 's/^CHECKS=\((.*)\)$/\1/p' script/check_all.sh)"
          if [ "$obtenu" != "$attendu" ]; then
            echo "check_all.sh enchaîne « $obtenu », la CI lance « $attendu »" >&2
            exit 1
          fi

      - name: check_format
        run: bash script/check_format.sh
      - name: check_rust
        run: bash script/check_rust.sh
      - name: check_python
        run: bash script/check_python.sh
      # Hors de `check_all.sh` — comme `check_clippy` : la passe normale ne doit
      # pas exiger gmsh d'un développeur qui ne touche pas à cette interface.
      # La CI, elle, l'exige. Après `check_python`, qui a construit le module.
      - name: check_gmsh
        run: bash script/check_gmsh.sh
      - name: check_examples
        run: bash script/check_examples.sh
      - name: check_doc
        run: bash script/check_doc.sh
      - name: check_clippy
        run: bash script/check_clippy.sh

  # Publier sur crates.io est une porte à sens unique : on ne franchit pas avant
  # de savoir que la sdist et les wheels se construisent. Sans cette dépendance,
  # la 0.3.2 est partie sur crates.io pendant que la matrice échouait — PyPI ne
  # l'a jamais reçue, et le numéro est brûlé.
  crates-io:
    needs: [check-version, sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Vérifier si déjà publié
        id: check
        run: |
          crate="$(sed -nE 's/^name = "(.*)"/\1/p' Cargo.toml | head -1)"
          version="${{ needs.check-version.outputs.version }}"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/$crate/$version")"
          echo "already=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: cargo publish
        if: steps.check.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: universal2-apple-darwin
            name: macos-universal2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # L'interpréteur de compilation ne se laisse pas au hasard du runner.
      # `pyo3-build-config` **refuse** de compiler quand le Python trouvé est
      # plus ancien que le plancher abi3 (« cannot set a minimum Python version
      # 3.11 higher than the interpreter version »). Avec `abi3-py39` cela
      # n'arrivait jamais ; à 3.11, un runner qui expose encore un 3.9 ferait
      # rougir ce job — au pire moment, celui de la publication.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # `--interpreter 3.11` vaut aussi pour Linux, où maturin tourne dans
          # le conteneur manylinux : `setup-python` n'y entre pas, et l'image
          # porte plusieurs CPython dont des antérieurs au plancher.
          args: --release --features ${{ env.MATURIN_FEATURES }} --interpreter 3.11 --out dist
          # plotters (feature viz, sous-feature ttf) a besoin des en-têtes
          # fontconfig/freetype pour lier le rendu de texte.
          before-script-linux: |
            yum install -y fontconfig-devel freetype-devel expat-devel || true
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  publish-pypi:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sdist
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Dernier job, et seul à dépendre des deux publications : son existence
  # atteste que crates.io et PyPI portent la même version que ce tag, et que
  # les artefacts joints portent les étiquettes de compatibilité attendues.
  github-release:
    needs: [check-version, crates-io, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7
        with:
          # git-cliff lit l'historique et les tags : un clone superficiel ne lui
          # montrerait qu'un seul commit.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: sdist
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Vérifier les étiquettes de compatibilité
        run: |
          # Ce que MATURIN_FEATURES promet, personne ne le vérifiait. Retirer
          # `abi3` de la variable produirait des wheels cp3XX-cp3XX, valables sur
          # un seul interpréteur : ici, le job rougit.
          ls -1 dist/
          [ "$(ls -1 dist/*.whl | wc -l)" = 3 ] || { echo "trois wheels attendues" >&2; exit 1; }
          [ "$(ls -1 dist/*.tar.gz | wc -l)" = 1 ] || { echo "une sdist attendue" >&2; exit 1; }
          for w in dist/*.whl; do
            case "$(basename "$w")" in
              *-cp311-abi3-*) ;;
              *) echo "$w n'est pas une wheel abi3-py311 : plancher Python non tenu" >&2; exit 1 ;;
            esac
          done
          for tag in manylinux2014_x86_64 win_amd64 "${MACOS_PLATFORM_TAG}"; do
            ls dist/*"$tag"*.whl >/dev/null 2>&1 || { echo "aucune wheel $tag" >&2; exit 1; }
          done

      - name: Confronter les deux formes de la version
        id: coherence
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # La forme PyPI ne se recalcule pas : elle se lit sur la sdist que
          # maturin vient de produire, seule autorité sur la normalisation
          # PEP 440 (`0.4.0-rc1` côté crate, `0.4.0rc1` côté wheel).
          sdist="$(ls dist/pyrucast-*.tar.gz)"
          pypi_version="$(basename "$sdist" .tar.gz)"
          pypi_version="${pypi_version#pyrucast-}"
          # Le tiret est en fin de classe : en tête, `tr` le lirait comme une
          # option, échouerait, et rendrait deux chaînes vides — donc égales.
          norm() { printf '%s' "$1" | tr -d '._-' | tr 'A-Z' 'a-z'; }
          if [ "$(norm "$VERSION")" != "$(norm "$pypi_version")" ]; then
            echo "le crate publie $VERSION et la wheel $pypi_version — formes non superposables" >&2
            exit 1
          fi
          echo "pypi_version=$pypi_version" >> "$GITHUB_OUTPUT"

      - name: Vérifier que les deux registres portent la version
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PYPI_VERSION: ${{ steps.coherence.outputs.pypi_version }}
        run: |
          # `cargo publish` et gh-action-pypi-publish savent tous deux sauter une
          # version déjà présente. Ce silence est utile pour rejouer un job, et
          # dangereux partout ailleurs : on constate, on ne suppose pas.
          wait_for() {
            for _ in $(seq 1 20); do
              code="$(curl -s -A 'pyrucast-release-workflow' -o /dev/null -w '%{http_code}' "$2")"
              [ "$code" = 200 ] && { echo "$1 : présent"; return 0; }
              sleep 15
            done
            echo "$1 : absent après 5 minutes ($2)" >&2
            return 1
          }
          wait_for "crates.io $VERSION" "https://crates.io/api/v1/crates/pyrucast/$VERSION"
          wait_for "PyPI $PYPI_VERSION" "https://pypi.org/pypi/pyrucast/$PYPI_VERSION/json"

      - name: Installer git-cliff
        env:
          GIT_CLIFF_VERSION: '2.13.1'
        run: |
          url="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz --strip-components=1 -C /usr/local/bin \
            "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          git-cliff --version

      - name: Rédiger le corps de la Release
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PYPI_VERSION: ${{ steps.coherence.outputs.pypi_version }}
        run: |
          # Le checkout est sur le tag poussé : « le tag courant » est exact, là
          # où `--latest` dépendrait de l'ordre des tags dans le dépôt.
          git-cliff --current --strip header -o NOTES.md
          # Des notes vides signeraient un tag mal vu ou une config muette :
          # mieux vaut un job rouge qu'une Release sans texte.
          [ -s NOTES.md ] || { echo "notes de version vides" >&2; exit 1; }
          {
            printf '**crates.io** [pyrucast %s](https://crates.io/crates/pyrucast/%s) · ' "$VERSION" "$VERSION"
            printf '**PyPI** [pyrucast %s](https://pypi.org/project/pyrucast/%s/)\n\n' "$PYPI_VERSION" "$PYPI_VERSION"
            printf 'Wheels `cp311-abi3` (Python ≥ 3.11) pour Linux x86_64, Windows x86_64 et macOS universal2.\n'
            printf 'La sdist se compile sans la visualisation : `pyrucast.__features__` dit ce que porte votre installation.\n\n'
            cat NOTES.md
          } > BODY.md
          cat BODY.md

      - name: Créer la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "pyrucast v${{ needs.check-version.outputs.version }}" \
            --notes-file BODY.md
