[package]
name = "pyrucast"
version = "0.6.0"
edition = "2024"
# Plancher de compilateur, à déclarer parce que rien ne le devine. Deux
# exigences le fixent, et c'est la plus haute qui gagne :
#   - le code emploie des **chaînes `let`** (`if let … = … && cond`), 43 fois,
#     stabilisées en **1.88** — l'edition 2024 n'en demanderait que 1.85 ;
#   - `nalgebra` 0.35 déclare `rust-version = 1.89`, et cargo refuse la
#     résolution en deçà.
# Sans cette ligne, un utilisateur recevrait une erreur de syntaxe brute ou un
# échec de résolution, au lieu d'un message qui nomme la version attendue.
rust-version = "1.89"
description = "Finite-element library in Rust, inspired by cast3m, exposed to Python"
authors = ["Gauthier F"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/Pyrucast/pyrucast"
# Only the Rust crate matters to crates.io consumers; the mdbook source,
# the Python companion package and teaching material are irrelevant there.
# Les motifs de répertoire sont **ancrés** par une barre oblique initiale :
# sans elle, `exclude` se lit comme un `.gitignore` et emporte tout répertoire
# du même nom, si profond soit-il.
exclude = [
    "/book/", "/python/", "/formation/", "tests/python/", "examples/*.py",
    "profile.json.gz", "opérateur_castem.csv", "modèle_castem.csv",
    # Dev-only tooling and internal notes, irrelevant to a crates.io consumer.
    "/.claude/", "/.github/", "recall.config.json", "/script/",
    ".git-blame-ignore-revs", "ROADMAP.md", "CONVENTIONS.md",
    # Code retiré temporairement, gardé pour être remis : ni compilé, ni publié.
    # C'est ce motif-là qui a fait échouer la publication de la 0.5.0 : non
    # ancré, il emportait aussi `src/archive/`, le module d'archivage que
    # `lib.rs` déclare — le paquet ne compilait plus une fois déballé (E0583),
    # alors que le dépôt, lui, compilait très bien.
    "/archive/",
]

[lib]
name = "pyrucast"
# cdylib: Python extension module; rlib: Rust API + tests + doctests.
crate-type = ["cdylib", "rlib"]

[dependencies]
paste = "1"
# Optional: the Python binding only. Enabled by the `python-api` feature,
# so a pure-Rust build (the default `cargo build` / `cargo test`) links
# neither pyo3 nor libpython. All `#[pyclass]`/`#[pyfunction]` code lives
# behind `#[cfg(feature = "python-api")]`.
pyo3 = { version = "0.29", features = ["multiple-pymethods"], optional = true }
serde = { version = "1", features = ["derive"] }
# Format binaire des archives (`save` / `load`). La 2.x demande la feature
# `serde` : le cœur de bincode 2 a ses propres traits `Encode`/`Decode`, et
# c'est ce pont qui laisse nos `#[derive(Serialize, Deserialize)]` continuer à
# servir. Ne jamais viser la 3.0.0 : son `lib.rs` tient en un
# `compile_error!("https://xkcd.com/2347/")`, c'est une publication inerte.
bincode = { version = "2", features = ["serde"] }
# Vector / matrix primitives used across geometry helpers, mesh
# builders and the visualization layer. `serde-serialize` lets nalgebra
# types travel through the Persist trait alongside our own structs.
nalgebra = { version = "0.35", features = ["serde-serialize"] }
# Sparse storage (CSR / CSC / COO) and matrix-vector operations. The release
# line is welded to nalgebra's: 0.12 ↔ nalgebra 0.35, 0.11 ↔ 0.34. The two
# move together or not at all.
nalgebra-sparse = "0.12"
# Shared-memory data parallelism. Always on: the heavy per-element /
# per-Gauss-point compute loops fan out across cores via rayon. Thread
# count honours `RAYON_NUM_THREADS`. Confined to the `parallel` module and
# the per-physics drivers (`models::kernel`); the physics kernels
# themselves never see it.
rayon = "1"
# Visualization stack (gated by features below).
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "svg_backend", "ttf", "line_series", "all_series"], optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
# Gzip for the `.svgz` output. Already compiled as part of the visualization
# stack (plotters-bitmap → image → png → flate2), so naming it here costs
# nothing beyond the direct dependency.
flate2 = { version = "1", optional = true }
# Stub-file generator: produces `pyrucast.pyi` so IDEs see signatures
# + docstrings instead of `Any`. Activated by the `stub-gen` feature
# and consumed by the `stub_gen` binary.
pyo3-stub-gen = { version = "0.23", optional = true }
# Per-slot locking of the global store. `arc_lock` provides the owned
# ('static) guards behind `store::read` / `store::write`, which is what
# lets operators hold data in place instead of copying it.
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
# Linear-solver backend: pure-Rust, multithreaded sparse LU. Confined to
# `ops::solver` — it consumes the CSC that nalgebra-sparse assembles and never
# leaks elsewhere. nalgebra (primitives) and nalgebra-sparse (assembly/storage)
# keep their roles.
faer = "0.24.4"

[dev-dependencies]
# Benchmark harness (see `benches/parallel.rs`). Run with `cargo bench`; vary
# `RAYON_NUM_THREADS` between runs to read the parallel speedup.
criterion = "0.8"

[[bench]]
name = "parallel"
harness = false

[[bench]]
name = "geom"
harness = false

[[bench]]
name = "mesh"
harness = false

[features]
# Compile the Python binding code (the `#[pyclass]` wrappers etc.). Pulls
# in the optional `pyo3` dependency. On its own, pyo3 links to libpython
# normally — fine for building utility binaries like `stub_gen`. Without
# this feature the crate is pure Rust (no pyo3, no libpython).
python-api = ["dep:pyo3"]
# Build as a Python extension module loaded by an interpreter. Tells
# pyo3 NOT to link to libpython, since the host interpreter provides
# it at runtime. Enabled by maturin when packaging the .so.
extension-module = ["python-api", "pyo3/extension-module"]
# Off-screen visualization (PNG / SVG / SVGZ export). Pure CPU rendering.
viz = ["dep:plotters", "dep:flate2"]
# Interactive visualization (mouse-driven window).
# Implies `viz`; requires a display server at runtime.
viz-interactive = ["viz", "dep:winit", "dep:softbuffer"]
# Generate the `pyrucast.pyi` stub file (see `src/bin/stub_gen.rs`).
# Pulls in the bindings but does NOT enable extension-module — the
# binary links to libpython like any other Rust program. Implies `viz`:
# `pyo3-stub-gen`'s `gen_stub_pymethods` reads every method in a
# `#[pymethods]` block regardless of its own `#[cfg(feature = "viz")]`
# (the outer attribute macro sees the raw tokens before cfg-stripping),
# so without `viz` truly active here the `.pyi` would document `plot`
# methods that a plain `python-api`/`extension-module` build (no `viz`)
# doesn't actually compile in.
#
# Combined with `abi3` this used to fail: `pyo3-stub-gen` unconditionally
# implements `PyStubType` for `PyEncodingWarning`, which `pyo3` only defines
# under `#[cfg(Py_3_10)]` — a cfg `abi3-py39` did not set (upstream issue
# Jij-Inc/pyo3-stub-gen#290, closed wontfix). The `abi3` floor is now
# `abi3-py311`, which does set `Py_3_10`, so the clash is gone and
# `cargo {build,check,clippy} --all-features` succeeds.
stub-gen = ["python-api", "dep:pyo3-stub-gen", "viz"]
# Build against Python's stable/limited API instead of a specific CPython
# minor version. One published wheel then installs on any supported
# interpreter, instead of `pip install` silently falling back to recompiling
# the sdist when the local Python doesn't match the wheel's exact cp3XX tag.
# Off by default: only the release CI (.github/workflows/release.yml) adds it
# — everyday `maturin develop` / `check.sh` / `build.sh` stay on pyo3's full
# (non-limited) API.
#
# The floor is **3.11**, not 3.9: `pyo3::buffer` is gated
# `#![cfg(any(not(Py_LIMITED_API), Py_3_11))]`, because `PyObject_GetBuffer`
# and `Py_buffer` only entered the limited API in CPython 3.11. Below that
# floor the buffer protocol is simply absent, and `ops::mesh::from_gmsh_arrays`
# reads its node and connectivity arrays through it. Raising the floor keeps
# the single wheel; the alternative was one wheel per CPython minor.
abi3 = ["pyo3/abi3-py311"]
