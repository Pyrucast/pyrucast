[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyrucast"
version = "0.2.1"
description = "Finite-element library in Rust, inspired by cast3m, exposed to Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
authors = [{ name = "Gauthier F" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/Pyrucast/pyrucast"

[tool.maturin]
# Pin the binding type. `pyo3` is an *optional* Cargo dependency (so a pure
# `cargo build` links no Python), which means maturin's auto-detection does
# not see it and wrongly falls back to `cffi` — it then runs its bundled
# cbindgen, which panics on our `Point2` type alias. Stating `pyo3`
# explicitly skips that guess.
bindings = "pyo3"
# Enable the Cargo `extension-module` feature (correct Python linkage).
features = ["extension-module"]
# Mixed Rust/Python layout: the pure-Python sources live in `python/` (package
# `python/pyrucast/`) and the compiled extension is placed inside that package
# as the private submodule `_pyrucast`. `pyrucast/__init__.py` re-exports it
# (`from ._pyrucast import *`) and adds the high-level Python layer, so
# `import pyrucast` keeps exposing every Rust symbol unchanged.
python-source = "python"
module-name = "pyrucast._pyrucast"

[tool.ruff]
# Style standard ruff (≈ black). On épingle la cible de version ; le reste
# suit les défauts (line-length = 88). `ruff format` met en forme les exemples
# et la suite de tests Python ; `ruff format --check` garde le standard (cf.
# script/check.sh).
target-version = "py39"
# Le stub de l'extension est généré par `stub_gen` (cargo) : le laisser hors de
# ruff, sinon il dériverait à chaque régénération.
extend-exclude = ["python/pyrucast/_pyrucast/__init__.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
