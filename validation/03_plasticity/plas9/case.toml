name = "plas9"
calculation_type = "MECHANICS ELASTIC PLASTIC - DRUCKER-PRAGER'S MATERIAL"
castem_element = "CUB8"
castem_version = "97' customer version"
source = ""
dgibi = "plas9.dgibi"
pyrucast = "`model.drucker_prager(fes, \"full_3d\")` in `stepping.step_by_step`, HEX8"

topic = """
A parallelepiped of a Drucker-Prager material with negative hardening is
pulled by an imposed displacement of one face; the uniaxial stress-strain
curve is compared with the exact one.
"""

goal = """
Compare the computed uniaxial curve σ_xx(ε_xx) with the exact solution
over the whole loading.
"""

model = """
A Drucker-Prager block in series with a block of an elastic material of
negligible stiffness, CUB8 elements.

| Data | Drucker-Prager block | elastic block |
|---|---|---|
| E | 40 000 | 2e-3 |
| ν | 0.21 | 0 |
| α = γ = η | 0.441 | |
| β = δ = μ | 1.02 | |
| K = K_L | 2 | |
| H | −10 000 | |

- Imposed displacement u_x = 1.5e-4·t on one face; computed times 0 to 4 by
  steps of 0.1.
- Exact curve: σ = E·ε while ε < K / ((α + β)·E), then
  σ = (K + H·m·ε) / ((α + β) + H·m / E), floored at 0, with
  m = √(2α² + β²) / (α + β).
- Compared quantity: max |σ − σ_exact| / K over the computed times.
"""

notes = """
The 2011 document prints no result table; the reference is the `.dgibi` file's.

The `.dgibi` file gives the ultimate surface equal to the initial one (K_L = K) and
H < 0. pyrucast reads the two surfaces as the ends of one interpolation
driven by H·p (see `src/models/plasticity/drucker_prager.rs`): with K_L = K
the interpolation is frozen, H has no effect, and the stress stays on the
plateau K / (α + β) instead of softening to zero. The gap measured is that
plateau against the exact curve's zero.

The `.dgibi` file adds, on the same cell, an elastic material of stiffness 2e-3 in
parallel; pyrucast refuses two laws carrying each their own E on one support,
and the script leaves it out (its stress stays below 1e-6).
"""

improvements = [
    "Drucker-Prager with two surfaces: pyrucast's interpolation driven by H·p departs from Cast3M when K_L < K, or when K_L = K with H ≠ 0",
    "two laws on one support (materials in parallel on the same cells)",
]

[[quantity]]
key = "curve_gap"
label = "max |σ − σ_exact| / K over the curve"
unit = ""
reference = 0.0
abs_tolerance = 5e-5
castem_probe = "RESI1"
