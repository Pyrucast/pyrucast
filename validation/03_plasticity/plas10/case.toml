name = "plas10"
calculation_type = "MECHANICS ELASTIC PLASTIC - CAM-CLAY'S MATERIAL"
castem_element = "CUB8"
castem_version = "97' customer version"
source = ""
deck = "plas10.dgibi"
gap = ["Cam-Clay law"]
tolerance = 1e-6
tolerance_note = "deck criteria, both relative gaps ≤ 1e-6."

topic = """
A parallelepiped of a Cam-Clay material is compressed hydrostatically by
displacements imposed on three of its faces.
"""

goal = "Compare the hydrostatic compression curve with the exact solution."

model = """
CUB8 block; the three faces x, y, z = 0 are fixed in their normal direction,
the three opposite faces receive the same normal displacement, −2.664328e-5
per time unit, up to t = 200.

| Data | Value |
|---|---|
| E | 1000 |
| ν | 0.2 |
| λ (XL) | 0.1 |
| κ (XK) | 0.01 |
| c (CC) | 0.5 |
| e (EE) | 2 |
| p₀ (PI0) | 5 |

- Exact solution at t = 200: σ_xx = −(p₀ + c)·exp(−300·u·(1 + e)/λ) + c and
  plastic volume strain 300·u·(λ − κ)/λ, with u = −2.664328e-5.
"""

notes = "The 2011 document prints no result table; the references are the deck's formulas."

[[quantity]]
key = "sxx_200"
label = "σ_xx at t = 200"
unit = ""
reference = -6.490398832766808
castem_probe = "PCAL"

