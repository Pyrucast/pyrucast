name = "elas11"
calculation_type = "MECHANICS ELASTICITY 2D AXI"
castem_element = "QUA8"
castem_version = "97' customer releas"
source = "Test NAFEMS : LE11 : Modélisation des structures élastiques dans CASTEM 2000."
deck = "elas11.dgibi"
pyrucast = "`model.elasticity(fes, \"axisymmetric\")` with a thermal strain, QUA8"
tolerance = 0.02
tolerance_note = "deck criterion, |σ_zz(A) + 105| / 105 ≤ 2 %."

topic = """
A thick solid of revolution made of a cylinder, a cone and a sphere (NAFEMS
LE11) is loaded by a temperature field that grows linearly with the radius
and the height, T = r + z. The problem is axisymmetric.
"""

goal = """
Find the axial stress at the point A (1, 0). The analytical value is
σ_zz = −105 MPa.
"""

model = """
Meridian plane (r, z), QUA8 elements (fine mesh of the deck, K = 2).

| Data | Value |
|---|---|
| E | 210e9 Pa |
| ν | 0.3 |
| α | 2.3e-4 /°C |
| reference temperature | 0 °C |

- Load: temperature T = r + z (°C).
"""

notes = """
The 2011 document gives the goal as σ_zz(A) = 105 MPa and the result table as
σ_yy(A) = −105 MPa; the deck compares σ_zz with −105 MPa.

`transfinite` puts the QUA8 mid-nodes of the arcs on the chords, where the
deck puts them on the arcs. Cast3M's thermal stress operator also replaces
the temperature of a mid-node of a quadratic cell by the mean of its edge's
corners, which differs from r + z on the arcs' mid-nodes; pyrucast heats every
node to r + z. With the deck's mid-nodes and its averaged temperatures,
pyrucast gives Cast3M's u_r(B) to round-off.
"""

improvements = [
    "`transfinite`: QUA8 mid-nodes on curved sides (it takes SEG2 sides and puts the mid-nodes on the chords)",
    "nodal stresses: extrapolation of the Gauss values to the nodes and average between the cells sharing a node (Cast3M `CHAN NOEUD` then `CHAN CHPO`)",
]

[[quantity]]
key = "szz_A"
label = "σ_zz at A"
unit = "MPa"
reference = -105.0
castem_2011 = -103.34
castem_probe = "SMZZA"

[[quantity]]
key = "ur_B"
label = "u_r at B (1.4, 0), no reference"
unit = "m"
castem_probe = "EXTR DEP1 UR PB"
