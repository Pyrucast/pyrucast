name = "elas11"
calculation_type = "MECHANICS ELASTICITY 2D AXI"
castem_element = "QUA8"
castem_version = "97' customer releas"
source = "Test NAFEMS : LE11 : Modélisation des structures élastiques dans CASTEM 2000."
dgibi = "elas11.dgibi"
pyrucast = "`model.elasticity(fes, \"axisymmetric\")` with a thermal strain, QUA8"
tolerance = 0.02
tolerance_note = "criterion of the `.dgibi` file, |σ_zz(A) + 105| / 105 ≤ 2 %."

topic = """
A thick solid of revolution made of a cylinder, a cone and a sphere (NAFEMS
LE11) is loaded by a temperature field that grows linearly with the radius
and the height, T = r + z. The problem is axisymmetric.
"""

goal = """
Find the axial stress at the point A (1, 0). The analytical value is
σ_zz = −105 MPa.
"""

model = """
Meridian plane (r, z), QUA8 elements (fine mesh of the `.dgibi` file, K = 2).

| Data | Value |
|---|---|
| E | 210e9 Pa |
| ν | 0.3 |
| α | 2.3e-4 /°C |
| reference temperature | 0 °C |

- Load: temperature T = r + z (°C).
"""

notes = """
The 2011 document gives the goal as σ_zz(A) = 105 MPa and the result table as
σ_yy(A) = −105 MPa; the `.dgibi` file compares σ_zz with −105 MPa.

The mesh is the `.dgibi` file's, the mid-nodes of the arcs on the arcs. Cast3M's
thermal stress operator replaces the temperature of a mid-node of a quadratic
cell by the mean of its edge's corners, which differs from r + z on the arcs'
mid-nodes; pyrucast heats every node to r + z, which a QUA8 reproduces
exactly. With the averaged temperatures, pyrucast gives Cast3M's u_r(B) to
round-off and its σ_zz(A) to 0.012 % (the rest is the reading at the node A):
the 0.10 point between the two codes on σ_zz(A), 1.592 % from the reference
for pyrucast and 1.490 % for Cast3M, is the temperature's.

Both are about 1.5 % from −105 MPa because the mesh is coarse. Refined, with
the exact geometry and temperature, pyrucast's σ_zz(A) goes from +1.592 %
(2 × 10 QUA8) to +0.395 % (4 × 20) and −0.182 % (8 × 40): the error of
discretisation, divided by 4 at the first refinement, towards about
−105.2 MPa — the NAFEMS target of −105 MPa is itself rounded. Mid-nodes on
the chords give −0.097 % on the 2 × 10 mesh, a compensation of errors that
refining undoes (−0.078 %, then −0.314 %).
"""

improvements = []

[[quantity]]
key = "szz_A"
label = "σ_zz at A"
unit = "MPa"
reference = -105.0
castem_2011 = -103.34
castem_probe = "SMZZA"

[[quantity]]
key = "ur_B"
label = "u_r at B (1.4, 0), no reference"
unit = "m"
castem_probe = "EXTR DEP1 UR PB"
