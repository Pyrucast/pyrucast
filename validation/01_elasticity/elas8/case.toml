name = "elas8"
calculation_type = "MECHANICS ELASTICITY 2D PLANE STRESS"
castem_element = "QUA8"
castem_version = "97' customer releas"
source = "Test NAFEMS : ME12 : Modélisation des structures élastiques dans CASTEM 2000."
deck = "elas8.dgibi"
pyrucast = "`model.elasticity(fes, \"plane_stress\")`, QUA8"
tolerance = 0.01
tolerance_note = "deck criterion, |σ_yy(D) − 92.7| / 92.7 ≤ 1 %."

topic = """
An elliptic membrane (NAFEMS LE1) is loaded by a uniform outward pressure on
its outer edge. By symmetry, one quarter is modelled in plane stress.
"""

goal = """
Find the stress σ_yy at the point D (2, 0). The analytical value is
σ_yy = 92.7 MPa.
"""

model = """
Quarter of the region between the inner ellipse x²/2² + y²/1² = 1 and the
outer ellipse x²/3.25² + y²/2.75² = 1, meshed with 24 QUA8: each elliptic
edge is the plane projection of a circular arc cut into 6 elements, each
straight edge has 4 elements.

| Data | Value |
|---|---|
| E | 210e9 Pa |
| ν | 0.3 |

- Boundary conditions: symmetry about x = 0 (u_x = 0) and y = 0 (u_y = 0).
- Load: outward pressure of 10 MPa on the outer elliptic edge.
"""

notes = """
The boundary nodes are the deck's. Inside, `transfinite` places the corner
nodes as the deck does, but puts the QUA8 mid-nodes of the elliptic edges on
the chords, where the deck puts them on the ellipses; σ_yy at D, where the
inner ellipse is the most curved, is sensitive to it. Cast3M also reads the
stress at a node differently: it extrapolates the Gauss values of the cell to
its nodes, pyrucast evaluates their least-squares fit. With mid-nodes placed
on the ellipses, the two codes give the same displacements and the same
Gauss stresses to round-off.
"""

improvements = [
    "an ellipse, or the projection of a line onto a plane (Cast3M `PROJ`)",
    "`transfinite`: QUA8 mid-nodes on curved sides (it takes SEG2 sides and puts the mid-nodes on the chords)",
    "nodal stresses: extrapolation of the Gauss values to the nodes and average between the cells sharing a node (Cast3M `CHAN NOEUD` then `CHAN CHPO`)",
]

[[quantity]]
key = "syy_D"
label = "σ_yy at D"
unit = "MPa"
reference = 92.7
castem_2011 = 93.548
castem_probe = "SMYYD"

[[quantity]]
key = "uy_B"
label = "u_y at B (0, 2.75), no reference"
unit = "m"
castem_probe = "EXTR DEP1 UY PB"
