name = "elas8"
calculation_type = "MECHANICS ELASTICITY 2D PLANE STRESS"
castem_element = "QUA8"
castem_version = "97' customer releas"
source = "Test NAFEMS : ME12 : Modélisation des structures élastiques dans CASTEM 2000."
dgibi = "elas8.dgibi"
pyrucast = "`model.elasticity(fes, \"plane_stress\")`, QUA8"
tolerance = 0.01
tolerance_note = "criterion of the `.dgibi` file, |σ_yy(D) − 92.7| / 92.7 ≤ 1 %."

topic = """
An elliptic membrane (NAFEMS LE1) is loaded by a uniform outward pressure on
its outer edge. By symmetry, one quarter is modelled in plane stress.
"""

goal = """
Find the stress σ_yy at the point D (2, 0). The analytical value is
σ_yy = 92.7 MPa.
"""

model = """
Quarter of the region between the inner ellipse x²/2² + y²/1² = 1 and the
outer ellipse x²/3.25² + y²/2.75² = 1, meshed with 24 QUA8: each elliptic
edge is the plane projection of a circular arc cut into 6 elements, each
straight edge has 4 elements.

| Data | Value |
|---|---|
| E | 210e9 Pa |
| ν | 0.3 |

- Boundary conditions: symmetry about x = 0 (u_x = 0) and y = 0 (u_y = 0).
- Load: outward pressure of 10 MPa on the outer elliptic edge.
"""

notes = """
The boundary nodes are the `.dgibi` file's, the mid-nodes of the ellipses included.
Inside, `transfinite` places the nodes as the `.dgibi` file's mesher does: the corners
by the transfinite interpolation, the mid-nodes at the middle of their chords.
The two codes give the same displacements to round-off (u_y(B) agrees to 7
digits). Cast3M reads the stress at a node differently: it extrapolates the
Gauss values of the cell to its nodes, pyrucast evaluates their least-squares
fit (`to_nodes`); D belongs to a single cell, so no average between cells
enters. σ_yy(D) is 0.841 % from the reference for pyrucast, 0.914 % for Cast3M.
"""

improvements = [
    "an ellipse, or the projection of a line onto a plane (Cast3M `PROJ`)",
    "nodal stresses at a node of a single QUA8 cell: Cast3M's extrapolation (`CHAN NOEUD`) and pyrucast's least-squares fit (`to_nodes`) differ, to look into",
]

[[quantity]]
key = "syy_D"
label = "σ_yy at D"
unit = "MPa"
reference = 92.7
castem_2011 = 93.548
castem_probe = "SMYYD"

[[quantity]]
key = "uy_B"
label = "u_y at B (0, 2.75), no reference"
unit = "m"
castem_probe = "EXTR DEP1 UY PB"
