name = "rupt7"
calculation_type = "MECHANICS ELASTIC"
castem_element = "QUA8, DIME 2"
castem_version = "97' customer version"
source = "Test NAFEMS : D.P.Rooke and D. J. Cartwright in Copendium of Intensity Factors HMSO (1976): rupt7 Modélisation des structures élastiques dans CASTEM 2000."
deck = "rupt7.dgibi"
gap = ["stress intensity factors (G-theta)"]
tolerance_note = "deck criterion on the G-θ values, |K_I| within 1 % and |K_II| within 6 % of the reference."

topic = """
A finite plate with an oblique edge crack (45°) under uniform tension. The
mixed-mode factors K_I and K_II are computed by the G-θ method and by
displacement extrapolation.
"""

goal = "Find the stress intensity factors K_I and K_II."

model = """
QUA8 elements; plate 0.125 × 0.125, crack length a = 0.05 at 45°, tension
σ = 10.

- Reference: K₀ = σ·√(πa)·cos α, K_I = K₀·cos α·1.216,
  K_II = −K₀·sin α·1.216, evaluated by the deck.
"""

notes = """
The Cast3M 2026 deck uses another unit system than the 2011 document, whose
values are K_I = 151.2 and K_II = −71.56 daN·mm^-3/2 for the references 150.37
and −71.4. The references here are those of the deck's formulas.
"""

[[quantity]]
key = "K1"
label = "K_I"
unit = "deck units"
tolerance = 0.01
castem_probe = "K1G"
reference_probe = "K1REF"

[[quantity]]
key = "K2"
label = "K_II"
unit = "deck units"
tolerance = 0.06
castem_probe = "K2G"
reference_probe = "-1. * K2REF"
