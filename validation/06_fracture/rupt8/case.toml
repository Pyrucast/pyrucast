name = "rupt8"
calculation_type = "MECHANICS ELASTICITY"
castem_element = "TRI3, 3D"
castem_version = "97' customer version"
source = "Test NAFEMS : D.P.Rooke and D. J. Cartwright in Copendium of Intensity Factors HMSO (1976): rupt8 Modélisation des structures élastiques dans CASTEM 2000."
dgibi = "rupt8.dgibi"
gap = ["stress intensity factors (G-theta)"]
tolerance = 0.05
tolerance_note = "criterion of the `.dgibi` file, |K − K_th| / K_th < 5 %."

topic = """
A central crack in a plate of finite width under uniform tension; a quarter
is modelled. G is computed by the G-θ method and K = √(E·G).
"""

goal = "Find the stress intensity factor K_I."

model = """
TRI3 elements; half crack length 0.3, half width 1, thickness 0.001.

| Data | Value |
|---|---|
| E | 2e11 Pa |
"""

notes = "The `.dgibi` file repeats the G-θ computation three times; the value is the last one."

[[quantity]]
key = "K1"
label = "K_I"
unit = "N·m^-3/2"
reference = 50.1e5
castem_2011 = 50.8e5
castem_probe = "K"
