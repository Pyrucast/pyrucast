name = "zeril1"
calculation_type = "ISOTROPIC ELASTOPLASTIC MECHANICS"
castem_element = "CUB8"
castem_version = "97' customer version"
source = ""
dgibi = "zeril1.dgibi"
gap = ["Zerilli-Armstrong law"]
tolerance = 0.01
tolerance_note = "criterion of the `.dgibi` file, plastic strain and stress within 1 % of the `.dgibi` file's integration at every time."

topic = """
A bar of a Zerilli-Armstrong elastoplastic material (body-centred cubic
form), held at its ends, is pulled by an imposed displacement.
"""

goal = """
Test the Zerilli-Armstrong model for a body-centred cubic structure against
the uniaxial curve integrated by the `.dgibi` file.
"""

model = """
CUB8 bar.

| Data | Value |
|---|---|
| E | 2.1e11 Pa |
| ν | 0.3 |
| ρ | 7.8e3 kg/m³ |
| α | 1e-5 /°C |
"""

notes = "The 2011 document prints no result table; the references are the `.dgibi` file's integration at the last time."

[[quantity]]
key = "sigma_end"
label = "axial stress at the last time"
unit = "Pa"
castem_probe = "sig0"
reference_probe = "sig_0"

[[quantity]]
key = "epsp_end"
label = "plastic strain at the last time"
unit = ""
castem_probe = "epsp0"
reference_probe = "def_0"
