name = "joi22"
calculation_type = "ISOTROPIC ELASTIC MECHANIC"
castem_element = "SEG2, JOI2"
castem_version = "97' customer version"
source = "Analytical solution (principle of virtual work)."
deck = "joi22.dgibi"
gap = ["joint element on its own, with normal and shear stiffnesses in its own frame (JOI2, JOI4)"]
tolerance = 1e-4
tolerance_note = "deck criterion, |δ − δ_th| / δ_th ≤ 1e-4."

topic = """
A plane joint element is pulled by a force normal to its plane, applied on
its upper side; its lower side is clamped.
"""

goal = "Test the JOI2 element: the opening of the joint under the force."

model = """
Plane stress. One JOI2 element between two coincident lines from (0, 0) to
(2, 0), the lower one clamped.

| Data | Value |
|---|---|
| normal stiffness k_n | 4.2e10 N/m³ |
| shear stiffness k_s | 4.2e8 N/m³ |
| joint length L | 2 m |
| joint width l | 1 m |

- Load: F_y = 1e5 N spread over the upper line.
- Reference: δ = F / (k_n·L·l) = 1e5 / (4.2e10 × 2 × 1).
"""

notes = """
The deck models the joint alone, between two lines and with no solid around
it. pyrucast's `model.interface_transfer` couples two faces of an existing
elasticity model, per global displacement component: it has no joint element
of its own.
"""

[[quantity]]
key = "uy_A1"
label = "opening u_y at A1"
unit = "m"
reference = 1.1904761904761905e-6
castem_probe = "DEPA1"
